LocalSocket /run/clamav/clamd.ctl
LocalSocketMode 660
User clamav
DatabaseDirectory /var/lib/clamav
Foreground yes
MaxThreads 2
MaxQueue 4
ReadTimeout 35
CommandReadTimeout 5
SendBufTimeout 5000
TemporaryDirectory /tmp
MaxFileSize 10M
MaxScanSize 50M
StreamMaxLength 10M
MaxScanTime 30000
AlertEncrypted yes
AlertExceedsMax yes
LogSyslog no
LogVerbose no
